[package]
name = "rmip-backend-ladder"
description = "The bundled pinning ladder: a polylog-verifier interleaved-RS commitment whose every level is one bundled, pinned tuple occurrence, audited sequentially; MIP path only"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rmip-field = { path = "../rmip-field" }
rmip-iop = { path = "../rmip-iop" }
rmip-backend-interleaved = { path = "../rmip-backend-interleaved" }
rmip-opt = { path = "../rmip-opt" }
rmip-mip-prover = { path = "../rmip-mip-prover" }

[features]
test-hooks = []

[dev-dependencies]
rmip-backend-ladder = { path = ".", features = ["test-hooks"] }
rmip-backend-conformance = { path = "../rmip-backend-conformance" }
rmip-mip = { path = "../rmip-mip" }
rmip-demo = { path = "../rmip-demo" }
rmip-frontend = { path = "../rmip-frontend" }
